<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090a0d">
<title>Henoch-klok (Light)</title>
<style>
:root{
  --bg:#090a0d;
  --panel:#111318;
  --gold:#d7b56d;
  --gold2:#f1d48d;
  --text:#f4f1e8;
  --muted:#9699a3;
  --line:#292c35;
  --ring:#1e2029;
  --night:#252833;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#090a0d;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;justify-content:center;align-items:center;padding:16px 12px}
.app{width:min(450px,100%)}

.card{background:linear-gradient(145deg,#15171f,#0e0f14);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 18px 50px #0008}

/* DATUM BOVENIN */
.date-box{background:#171711;border:1px solid #493f28;border-radius:16px;padding:12px;text-align:center;margin-bottom:16px}
.hebrew-date{font-size:1.15rem;font-weight:800;color:var(--gold2)}
.greg-date{font-size:.8rem;color:var(--muted);margin-top:2px}

/* CIRKEL KLOK */
.ring-wrap{position:relative;width:min(68vw,230px);aspect-ratio:1;margin:10px auto 16px}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--ring);stroke-width:8}
.ring{fill:none;stroke:url(#goldGradient);stroke-width:8;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(215,181,109,0.35))}

.ring-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.ring-phase{font-size:.9rem;font-weight:800;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.ring-number{font-size:clamp(3.5rem,18vw,4.8rem);font-weight:900;color:var(--gold2);line-height:1;margin:-2px 0}
.ring-countdown{font-variant-numeric:tabular-nums;font-size:1.4rem;font-weight:700;color:var(--text)}

/* 24-UURS METER & ETMAAL VORDERING */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.info-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.label{color:var(--muted);font-size:.65rem;text-transform:uppercase;letter-spacing:.08em}
.value{margin-top:2px;font-size:.95rem;font-weight:700;font-variant-numeric:tabular-nums}

.timeline{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.bar-track{height:22px;border-radius:8px;overflow:hidden;position:relative;background:var(--night);border:1px solid #343742;margin-top:6px}
.bar-fill{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#a28246,#efd48e)}
.marker{position:absolute;top:-2px;width:3px;height:26px;background:#fff;box-shadow:0 0 8px #fff;z-index:2}
.bar-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:.65rem;margin-top:4px}
.sub-bar{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
</style>
</head>
<body>

<div class="app">
  <div class="card">
    
    <!-- DATUM -->
    <div class="date-box">
      <div class="hebrew-date" id="hebrewDate">—</div>
      <div class="greg-date" id="gregDate">—</div>
    </div>

    <!-- 18-HENOCH UUR RING -->
    <div class="ring-wrap">
      <svg viewBox="0 0 120 120">
        <defs>
          <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d7b56d" />
            <stop offset="100%" stop-color="#f1d48d" />
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="60" cy="60" r="50"/>
        <circle class="ring" id="ring" cx="60" cy="60" r="50" stroke-dasharray="314.159" stroke-dashoffset="0"/>
      </svg>
      <div class="ring-center">
        <div class="ring-phase" id="ringPhase">DAG</div>
        <div class="ring-number" id="ringNumber">1</div>
        <div class="ring-countdown" id="ringCountdown">80:00</div>
      </div>
    </div>

    <!-- LOKALE TIJD & ETMAAL % -->
    <div class="grid">
      <div class="info-box"><div class="label">24-uurs tijd</div><div class="value" id="clock">--:--:--</div></div>
      <div class="info-box"><div class="label">Etmaal Vordering</div><div class="value" id="dayPct">--%</div></div>
    </div>

    <!-- 24-UURS ETMAAL BALK & DAG/NACHT METERS -->
    <div class="timeline">
      <div class="label">24-uurs etmaal (00:00 - 24:00)</div>
      <div class="bar-track">
        <div class="bar-fill" id="dayBand"></div>
        <div class="marker" id="nowMarker"></div>
      </div>
      <div class="bar-labels"><span>00:00</span><span>12:00</span><span>24:00</span></div>

      <div class="sub-bar">
        <div class="label">Daglicht vordering</div>
        <div class="bar-track" style="height:14px">
          <div class="bar-fill" id="dayFill"></div>
          <div class="marker" id="dayMarker" style="height:18px"></div>
        </div>
        <div class="bar-labels"><span>Schemering</span><span id="dayPctTxt">0%</span><span>Zonsondergang</span></div>
      </div>

      <div class="sub-bar">
        <div class="label">Nacht vordering</div>
        <div class="bar-track" style="height:14px">
          <div class="bar-fill" id="nightFill"></div>
          <div class="marker" id="nightMarker" style="height:18px"></div>
        </div>
        <div class="bar-labels"><span>Zonsondergang</span><span id="nightPctTxt">0%</span><span>Schemering</span></div>
      </div>
    </div>

  </div>
</div>

<script>
"use strict";
const LAT = 52.155, LON = 5.387; // Standaard Nederland
const DAY = 86400000, PART = 80 * 60000, C = 2 * Math.PI * 50;

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

function solarEvent(date, isSunrise, zenith = 96) {
  const doy = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / DAY);
  const lngHour = LON / 15, t = doy + (((isSunrise ? 6 : 18) - lngHour) / 24);
  const M = .9856 * t - 3.289;
  let L = (M + 1.916 * Math.sin(M * Math.PI/180) + .020 * Math.sin(2 * M * Math.PI/180) + 282.634) % 360;
  if (L < 0) L += 360;
  let RA = (Math.atan(.91764 * Math.tan(L * Math.PI/180)) * 180/Math.PI) % 360;
  if (RA < 0) RA += 360;
  RA = (RA + (Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90)) / 15;
  const sinDec = .39782 * Math.sin(L * Math.PI/180), cosDec = Math.cos(Math.asin(sinDec));
  const cosH = (Math.cos(zenith * Math.PI/180) - sinDec * Math.sin(LAT * Math.PI/180)) / (cosDec * Math.cos(LAT * Math.PI/180));
  if (cosH > 1 || cosH < -1) return null;
  let UT = (Math.acos(clamp(cosH, -1, 1)) * 180/Math.PI) / 15 * (isSunrise ? -1 : 1) + RA - .06571 * t - 6.622 - lngHour;
  UT = ((UT % 24) + 24) % 24;
  return new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), 0, 0, 0, 0) + UT * 3600000);
}

function getSunTimes(d) {
  return { dawn: solarEvent(d, true, 96), sunset: solarEvent(d, false, 90.833) };
}

function update() {
  const now = new Date();
  
  // Datums
  $("gregDate").textContent = new Intl.DateTimeFormat("nl-NL", {weekday: "long", day: "numeric", month: "long", year: "numeric"}).format(now);
  try {
    const f = new Intl.DateTimeFormat("en-u-ca-hebrew", {day: "numeric", month: "long", year: "numeric"});
    const p = {}; for (const x of f.formatToParts(now)) if (x.type !== "literal") p[x.type] = x.value;
    $("hebrewDate").textContent = `${p.day} ${p.month} ${p.year}`;
  } catch(e){}

  // Klok
  $("clock").textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

  // Henoch Uur Berekening
  const sun = getSunTimes(now);
  if (sun.sunset) {
    let baseSunset = sun.sunset;
    if (now < baseSunset) {
      const prev = new Date(now.getTime() - DAY);
      baseSunset = getSunTimes(prev).sunset;
    }
    const elapsedEtmaal = now.getTime() - baseSunset.getTime();
    const hIndex = clamp(Math.floor(elapsedEtmaal / PART), 0, 17);
    const hElapsed = elapsedEtmaal - (hIndex * PART);

    const nextDawn = getSunTimes(new Date(baseSunset.getTime() + DAY)).dawn;
    const isDay = (now >= sun.dawn && now < sun.sunset);
    
    $("ringPhase").textContent = isDay ? "DAG" : "NACHT";
    
    // Uurnummer bepalen
    let count = 0;
    for(let i=0; i<=hIndex; i++){
      const mid = new Date(baseSunset.getTime() + i*PART + PART/2);
      const midIsDay = (mid >= sun.dawn && mid < sun.sunset);
      if(midIsDay === isDay) count++;
    }
    $("ringNumber").textContent = count || 1;

    // Afteller
    const rem = Math.max(0, PART - hElapsed);
    const sec = Math.floor(rem / 1000);
    $("ringCountdown").textContent = `${pad(Math.floor(sec/60))}:${pad(sec%60)}`;
    $("ring").style.strokeDashoffset = String(C * (hElapsed / PART));

    // Etmaal %
    $("dayPct").textContent = `${Math.round((elapsedEtmaal / DAY) * 100)}%`;
  }

  // 24-uurs Timeline Markers
  const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
  const nowP = (now - dayStart) / DAY * 100;
  const sP = sun.dawn ? (sun.dawn - dayStart) / DAY * 100 : 25;
  const eP = sun.sunset ? (sun.sunset - dayStart) / DAY * 100 : 75;

  $("dayBand").style.left = `${clamp(sP, 0, 100)}%`;
  $("dayBand").style.width = `${clamp(eP - sP, 0, 100)}%`;
  $("nowMarker").style.left = `${clamp(nowP, 0, 100)}%`;

  // Daglicht / Nacht Meters
  if(sun.dawn && sun.sunset){
    const dayLength = sun.sunset - sun.dawn;
    const dayProgress = clamp((now - sun.dawn) / dayLength, 0, 1);
    $("dayFill").style.width = `${dayProgress * 100}%`;
    $("dayMarker").style.left = `${dayProgress * 100}%`;
    $("dayPctTxt").textContent = `${Math.round(dayProgress * 100)}%`;

    let nightStart = sun.sunset, nextDawn = getSunTimes(new Date(now.getTime() + DAY)).dawn;
    if (now < sun.sunset) {
      nightStart = getSunTimes(new Date(now.getTime() - DAY)).sunset;
      nextDawn = sun.dawn;
    }
    const nightLength = nextDawn - nightStart;
    const nightProgress = clamp((now - nightStart) / nightLength, 0, 1);
    $("nightFill").style.width = `${nightProgress * 100}%`;
    $("nightMarker").style.left = `${nightProgress * 100}%`;
    $("nightPctTxt").textContent = `${Math.round(nightProgress * 100)}%`;
  }
}

update();
setInterval(update, 1000);
</script>
</body>
</html>
